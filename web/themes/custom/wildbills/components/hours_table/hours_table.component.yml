$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Hours
description: "The week's opening hours from the dealership details, Monday to Sunday, with today marked and whether the lot is open now, both reckoned in the dealership's time zone in the visitor's browser."
group: "Wild Bill's location"
status: stable
props:
  type: object
  required:
    - heading
  properties:
    heading:
      type: string
      title: Heading
      description: The panel's heading.
      examples: ['Hours']
    checking_label:
      type: string
      title: Status before it is worked out
      description: Shown in the status line until the browser has worked out whether the lot is open.
      examples: ['Checking hours…']
    note:
      type: string
      title: Note
      description: The small line under the hours.
      examples: ["Status uses the dealership's local time."]
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
